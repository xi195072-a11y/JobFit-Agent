name: ci

# Phase 6 CI（§10–§13、§61）：push / PR 自动跑
#   backend tests + integration + ruff + mypy
#   frontend lint + typecheck + tests + build
#   E2E（真实 backend + 真实前端）
#   golden evaluation
#
# 红线：
# - 不依赖 DEEPSEEK_API_KEY（默认 DeterministicProvider，ADR-029/§10/§53）
# - 使用真实 pgvector service + 真实 migration（§11，禁止全 mock DB）
# - 任何 test 失败 => workflow 失败（§12/§61，不允许吞掉失败）

on:
  push:
    branches: ["**"]
  pull_request:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  APP_ENV: test
  PIPELINE_VERSION: ci
  DATABASE_URL: postgresql+psycopg://jobfit:jobfit@localhost:5432/jobfit
  TEST_DATABASE_URL: postgresql+psycopg://jobfit:jobfit@localhost:5432/jobfit_test
  STORAGE_DIR: ${{ github.workspace }}/.ci-storage
  CONFIG_DIR: ${{ github.workspace }}/backend/config
  LLM_PROVIDER: deepseek
  DEEPSEEK_MODEL: ci-deterministic

jobs:
  # ---------------------------------------------------------------- backend
  backend:
    name: backend (tests + integration + ruff + mypy)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobfit
          POSTGRES_PASSWORD: jobfit
          POSTGRES_DB: jobfit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobfit -d jobfit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create test database
        run: |
          PGPASSWORD=jobfit psql -h localhost -U jobfit -d jobfit -c 'CREATE DATABASE jobfit_test;'
          PGPASSWORD=jobfit psql -h localhost -U jobfit -d jobfit_test -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Alembic migrate (real DB, §11)
        working-directory: backend
        run: |
          alembic current
          alembic upgrade head
          alembic check

      - name: ruff
        working-directory: backend
        run: ruff check src tests alembic

      - name: mypy
        working-directory: backend
        run: mypy src/jobfit tests

      - name: pytest (JUnit authoritative, §64)
        working-directory: backend
        run: pytest tests --junitxml=../phase6-junit.xml -q

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit
          path: phase6-junit.xml
          if-no-files-found: error

  # ---------------------------------------------------------------- frontend
  frontend:
    name: frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: lint
        working-directory: frontend
        run: npm run lint

      - name: typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: tests (JUnit)
        working-directory: frontend
        run: npm run test:junit

      - name: build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Upload frontend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-junit
          path: frontend/frontend-junit.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------- golden evaluation
  golden:
    name: golden evaluation (11 cases)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobfit
          POSTGRES_PASSWORD: jobfit
          POSTGRES_DB: jobfit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobfit -d jobfit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create test database
        run: |
          PGPASSWORD=jobfit psql -h localhost -U jobfit -d jobfit -c 'CREATE DATABASE jobfit_test;'
          # golden 经 conftest 连接 TEST_DATABASE_URL(jobfit_test) 并自行建表，需要 pgvector extension
          PGPASSWORD=jobfit psql -h localhost -U jobfit -d jobfit_test -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Golden evaluation (§23)
        working-directory: backend
        run: python -m jobfit.evaluation --out-json ../phase6-evaluation.json --out-md ../phase6-evaluation.md

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-evaluation
          path: |
            phase6-evaluation.json
            phase6-evaluation.md
          if-no-files-found: error

  # ---------------------------------------------------------------- e2e
  e2e:
    name: e2e (Playwright, real backend + real frontend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobfit
          POSTGRES_PASSWORD: jobfit
          POSTGRES_DB: jobfit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobfit -d jobfit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      # E2E harness 自行创建表并注入 DeterministicProvider（无 live 依赖）
      JOBFIT_PYTHON: python
      JOBFIT_E2E_BACKEND_URL: http://127.0.0.1:8000
      JOBFIT_E2E_FRONTEND_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create test database
        run: |
          PGPASSWORD=jobfit psql -h localhost -U jobfit -d jobfit -c 'CREATE DATABASE jobfit_test;'
          # E2E harness(tests/e2e/backend/app.py) 连接 DATABASE_URL(jobfit) 并自行建表，需要 pgvector extension
          PGPASSWORD=jobfit psql -h localhost -U jobfit -d jobfit -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install E2E deps + browser
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E (exit code authoritative, §52/§64)
        working-directory: tests/e2e
        run: |
          npm run test:junit
          npm run screenshots

      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            tests/e2e/e2e-junit.xml
            tests/e2e/playwright-report/
            docs/screenshots/
          if-no-files-found: warn
