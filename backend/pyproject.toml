[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfit"
version = "0.1.0"
description = "JobFit Agent backend (Evidence-Grounded AI Career Intelligence Platform)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "structlog>=24.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "tests"]
addopts = "-q"
markers = [
    "db: 需要真实 PostgreSQL(pgvector) 的集成测试（无 DB 时自动 skip）",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src/jobfit", "tests"]
plugins = ["sqlalchemy.ext.mypy.plugin"]
warn_unused_ignores = false
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
exclude = ["\\.venv/"]

# ORM 互操作模块：db/models.py 采用 SQLAlchemy legacy（未注解）Column 声明，
# mypy 会把 ORM 实例属性当成 Column[...] 而非标量（根治需迁移到 Mapped[...] 注解 + plugin）。
# 这里只豁免与"ORM 属性类型窄化"相关的错误码，业务逻辑与其它类型检查照常生效。
[[tool.mypy.overrides]]
module = [
    "jobfit.parsing.service",
    "jobfit.extraction.service",
    "jobfit.workflow.runner",
    "jobfit.api.v1.extractions",
]
disable_error_code = ["arg-type", "assignment", "attr-defined"]

[[tool.mypy.overrides]]
module = [
    "jobfit.db.repositories.results",
    "jobfit.matching.facts",
    "jobfit.matching.service",
    "jobfit.matching.trace",
    "jobfit.evidence.retrieval",
    "jobfit.workflow.nodes",
    "jobfit.api.services",
    "jobfit.api.v1.analysis",
    "jobfit.api.v1.catalog",
]
disable_error_code = ["arg-type", "assignment", "attr-defined", "union-attr", "call-overload"]

# Phase 4（critique/report/review）同样基于 legacy Column 声明访问 ORM 属性，
# 与上方同理由豁免"ORM 属性类型窄化"错误码；业务逻辑类型检查照常生效。
[[tool.mypy.overrides]]
module = [
    "jobfit.critique.context",
    "jobfit.reports.builder",
    "jobfit.reports.validator",
    "jobfit.review.service",
    "jobfit.api.v1.phase4",
]
disable_error_code = ["arg-type", "assignment", "attr-defined", "union-attr", "call-overload"]
