version: "0.2.0"
# 地点归一化（确定性、可版本化）。
# canonical（键）为归一化结果；values 为被接受的写法。
# 未声明的写法不参与归一（保持原值），比较时按形式归一后的字符串相等判定；
# 无法判定一律 UNKNOWN（绝不推断 location OK / Not OK，Phase 3 §10）。
aliases:
  深圳: ["深圳", "深圳市", "广东深圳", "广东省深圳市"]
  北京: ["北京", "北京市"]
  上海: ["上海", "上海市"]
  南京: ["南京", "南京市"]
  杭州: ["杭州", "杭州市"]
  广州: ["广州", "广州市"]
  成都: ["成都", "成都市"]
  武汉: ["武汉", "武汉市"]
normalization:
  strategy: canonical_city
  match_scope: exact_canonical
